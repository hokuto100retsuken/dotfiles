[tools]
go = "1.27.3"
node = "26"
claude = "latest"
antigravity-cli = "latest"
neovim = "0.12.5"
"github:babarot/claude-recall" = { version = "latest", bin = "recall" }

# settings.json は Claude Code 自身も書き換えるので、ファイルごとは持たずキー単位で管理する。
# shared は常にこの値に揃え、defaults は値がないときだけ埋める。
# 配列はまるごと置き換わるため、Claude Code や herdr・業務用 dotfiles が書き足す
# permissions.allow と hooks は defaults に置く。
[dotfiles]
"~/.claude/settings.json/shared" = { source = "~/src/github.com/hokuto100retsuken/dotfiles/claude/settings/shared.json", merge = true }
"~/.claude/settings.json/defaults" = { source = "~/src/github.com/hokuto100retsuken/dotfiles/claude/settings/defaults.json", merge = "missing" }
"~/.gemini/antigravity-cli/settings.json/shared" = { source = "~/src/github.com/hokuto100retsuken/dotfiles/gemini/settings/shared.json", merge = true }
"~/.gemini/antigravity-cli/settings.json/defaults" = { source = "~/src/github.com/hokuto100retsuken/dotfiles/gemini/settings/defaults.json", merge = "missing" }

[tasks.ccupdate]
description = 'Claude Codeを最新版に更新'
run = """
#!/usr/bin/env fish

mise use --global claude@latest
mise prune claude
"""

[tasks.agyupdate]
description = 'Antigravity CLIを最新版に更新'
run = """
#!/usr/bin/env fish

mise use --global antigravity-cli@latest
mise prune antigravity-cli
"""
