[tools]
go = "1.27.3"
node = "26"
claude = "latest"
antigravity-cli = "latest"
neovim = "0.12.5"
"github:babarot/claude-recall" = { version = "latest", bin = "recall" }

[tasks.ccupdate]
description = 'Claude Codeを最新版に更新'
run = """
#!/usr/bin/env fish

mise use --global claude@latest
mise prune claude
"""

[tasks.agyupdate]
description = 'Antigravity CLIを最新版に更新'
run = """
#!/usr/bin/env fish

mise use --global antigravity-cli@latest
mise prune antigravity-cli
"""
